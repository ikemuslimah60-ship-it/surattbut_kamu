<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebuah Surat Spesial Untukmu</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            bottom: -10vh;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 85%;
            text-align: center;
            border: 2px dashed #ff758c;
            position: relative;
            z-index: 10;
        }

        .card h2 {
            font-family: 'Dancing Script', cursive;
            color: #ff477e;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .letter-content {
            font-size: 1.15rem;
            color: #444;
            line-height: 1.7;
            min-height: 120px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
        setInterval(createHeart, 400);
    </script>

    <div class="card">
        <h2>Untuk Azka ✨</h2>
        <div id="content" class="letter-content"></div>
        <button id="nextBtn" onclick="nextStep()">Lanjut ➔</button>
    </div>

    <script>
        const steps = [
            "Hai sayang! Aku kasih ini sebagai tanda permintaan maafku yang tulus ❤️",
            "Hai Azka, maafin Yasmin ya udah sering ngecewain kamu.",
            "Bikin susah kamu dan masih banyak lagi sih, maapin ya sayang. Dan makasih ya Azka udah selalu berjuang di dalam hubungan kita ini.",
            "Yasmin sebenarnya cuma mau ngetes Azka kuat apa ngga sama Yasmin. Pokoknya maaf dan makasih yaaa!",
            "Yasmin sayang Azka banyak-banyak, makasih udah mau mengalah untuk semuanya.",
            "Maaf ya sayang Yasmin belum bisa jadi yang terbaik buat Azka, semoga Yasmin bisa berubah ya.",
            "Itu aja ya sayang, I LOVE U ❤️"
        ];

        let currentIndex = 0;
        const contentDiv = document.getElementById("content");
        const nextBtn = document.getElementById("nextBtn");

        function updateContent() {
            contentDiv.innerHTML = steps[currentIndex];
        }

        function nextStep() {
            currentIndex++;
            if (currentIndex < steps.length) {
                updateContent();
            } else {
                nextBtn.classList.add("hidden");
                contentDiv.innerHTML = "Suratnya sudah habis! ✨<br>Semoga harimu menyenangkan ya, Azka!";
            }
        }

        updateContent();
    </script>

</body>
</html>
